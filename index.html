<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Multi-Step Form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="form-container">
      <h1>Multi-Step Form</h1>
      <p class="subtitle">Complete the form step by step</p>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <p class="step-text">Step <span id="currentStep">1</span> of 3</p>

      <form id="multiStepForm">
        <div class="step active">
          <h2>Personal Information</h2>

          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="step">
          <h2>Contact Information</h2>

          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            placeholder="Enter your phone number"
            required
          />

          <label for="city">City</label>
          <input type="text" id="city" placeholder="Enter your city" required />
        </div>

        <div class="step">
          <h2>Additional Information</h2>

          <label for="course">Course</label>

          <select id="course" required>
            <option value="">Select a course</option>
            <option value="Web Development">Web Development</option>
            <option value="Data Analytics">Data Analytics</option>
            <option value="UI/UX Design">UI/UX Design</option>
          </select>

          <label for="message">Message</label>

          <textarea
            id="message"
            placeholder="Write something..."
            required
          ></textarea>
        </div>

        <div class="buttons">
          <button type="button" id="previousBtn" onclick="previousStep()">
            Previous
          </button>

          <button type="button" id="nextBtn" onclick="nextStep()">Next</button>
        </div>
      </form>

      <div class="summary" id="summary">
        <h2>Final Summary</h2>

        <p>
          <strong>Name:</strong>
          <span id="summaryName"></span>
        </p>

        <p>
          <strong>Email:</strong>
          <span id="summaryEmail"></span>
        </p>

        <p>
          <strong>Phone:</strong>
          <span id="summaryPhone"></span>
        </p>

        <p>
          <strong>City:</strong>
          <span id="summaryCity"></span>
        </p>

        <p>
          <strong>Course:</strong>
          <span id="summaryCourse"></span>
        </p>

        <p>
          <strong>Message:</strong>
          <span id="summaryMessage"></span>
        </p>

        <button type="button" onclick="submitForm()">Submit</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
